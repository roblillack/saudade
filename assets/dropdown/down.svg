<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 16 16"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Dropdown indicator: the scrollbar "down" triangle (5px base, 3px tall,
       apex at y=8.5) with a 5px-wide, 1px-tall horizontal bar one pixel below
       it — the classic combobox "drops a list open" glyph. The triangle + bar
       group is centered in the 16-unit viewBox so it lands centered in the
       arrow button. Baked black is a placeholder: it is drawn tinted with the
       theme's text color. -->
  <path
     d="m 8,8.5 -2.5,-3 h 5 z M 5.5,9.5 h 5 v 1 h -5 z"
     fill="#000000"
     id="path1" />
</svg>
