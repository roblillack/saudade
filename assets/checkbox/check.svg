<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 13">
  <!-- Classic Win 3.1 checkbox tick: a short stroke down to the vertex, then a
       long stroke up to the top-right. Sized a touch inside the 13-unit box —
       its round caps stop just shy of the frame so the glyph never touches the
       border. Baked black is only a placeholder — it is drawn tinted with the
       theme's (possibly disabled) text color via SvgImage::draw_tinted. -->
  <path d="M 2.9,6.5 L 5.15,9.2 L 10.1,3.35"
        fill="none" stroke="#000000"
        stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
