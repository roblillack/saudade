<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Win 3.1 control-menu box glyph (the close box): a beveled horizontal bar,
     baked from Canoe's title-bar close icon. Three stacked rects in document
     order give the bevel: gray shadow, black bar, white highlight. -->
<svg viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <rect fill="#808080" width="13" height="3" x="2" y="7" />
  <rect fill="#000000" width="13" height="3" x="1" y="6" />
  <rect fill="#ffffff" width="11" height="1" x="2" y="7" />
</svg>
