<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Document for file rows: a white page with a folded top-right corner and
       three text rules. The black page silhouette (with the dog-ear cut) sits
       under a white face drawn one unit inside, leaving a crisp 1px outline. -->
  <path d="M3 1 H10 L13 4 V15 H3 Z" fill="#000000"/>
  <path d="M4 2 H9 V5 H12 V14 H4 Z" fill="#ffffff"/>
  <!-- The fold: a small triangle of the page's underside. -->
  <path d="M10 2 V4 H12 Z" fill="#000000"/>
  <!-- Text rules. -->
  <rect x="5" y="7" width="6" height="1" fill="#000000"/>
  <rect x="5" y="9" width="6" height="1" fill="#000000"/>
  <rect x="5" y="11" width="4" height="1" fill="#000000"/>
</svg>
